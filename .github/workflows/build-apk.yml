name: Build Shruti's Life RPG

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'settings.gradle')"
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'build.gradle')"
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNi4xJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle')"
          echo '' | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/shruti/liferpg/MainActivity.java')"
          echo '' | base64 -d > 'app/src/main/java/com/shruti/liferpg/MainActivity.java'
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          echo 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlNocnV0aSdzIExpZmUgUlBHPC9zdHJpbmc+CjwvcmVzb3VyY2VzPgo=' | base64 -d > 'app/src/main/res/values/strings.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          echo 'PHJlc291cmNlcz4KICAgIDxjb2xvciBuYW1lPSJ0cmFuc3BhcmVudCI+IzAwMDAwMDAwPC9jb2xvcj4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > 'app/src/main/res/values/colors.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/themes.xml'
          mkdir -p "$(dirname 'app/src/main/assets/index.html')"
          echo '' | base64 -d > 'app/src/main/assets/index.html'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shruti-life-rpg-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
