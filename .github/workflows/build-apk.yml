name: Build Shruti's Life RPG APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore persistent debug signing key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          mkdir -p ~/.android /tmp/rpg-signing
          ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name | startswith("shruti-signing-key-"))) | sort_by(.created_at) | last.id // empty')
          if [ -n "$ART_ID" ]; then
            gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/rpg-signing/key.zip
            unzip -q /tmp/rpg-signing/key.zip -d /tmp/rpg-signing
            cp /tmp/rpg-signing/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -e
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.shruti.liferpg'" /tmp/apk-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/apk-badging.txt
          cp "$APK" app/build/outputs/apk/debug/shruti-life-rpg-v1.4.apk

      - name: Test install on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/shruti-life-rpg-v1.4.apk
            adb shell pm path com.shruti.liferpg
            adb shell monkey -p com.shruti.liferpg 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shruti-life-rpg-apk-v1.4
          path: app/build/outputs/apk/debug/shruti-life-rpg-v1.4.apk
          if-no-files-found: error

      - name: Preserve signing key for future builds
        uses: actions/upload-artifact@v4
        with:
          name: shruti-signing-key-${{ github.run_id }}
          path: ~/.android/debug.keystore
          retention-days: 90
          if-no-files-found: error
