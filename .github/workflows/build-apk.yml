name: Build Shruti's Life RPG APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rpg
          sed -n "/<<'PAYLOAD'/,/^[[:space:]]*PAYLOAD$/p" .github/workflows/build-apk-fixed.yml | sed '1d;$d;s/^[[:space:]]*//' > /tmp/rpg/payload.b64
          test -s /tmp/rpg/payload.b64
          base64 -d /tmp/rpg/payload.b64 > /tmp/rpg/project.zip
          unzip -q /tmp/rpg/project.zip -d "$GITHUB_WORKSPACE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Android app label
        shell: bash
        run: |
          sed -i "s/Shruti's Life RPG/Shruti Life RPG/" app/src/main/res/values/strings.xml
          sed -i "/androidx.appcompat:appcompat/d" app/build.gradle
          sed -i 's/parent="Theme.AppCompat.Light.NoActionBar"/parent="@android:style\/Theme.Material.Light.NoActionBar"/' app/src/main/res/values/themes.xml

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shruti-life-rpg-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
