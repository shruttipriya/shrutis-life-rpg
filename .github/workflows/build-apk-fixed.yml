PAYLOAD
          base64 -d /tmp/rpg/payload.b64 > /tmp/rpg/project.zip
          unzip -q /tmp/rpg/project.zip -d "$GITHUB_WORKSPACE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Android app label
        run: |
          sed -i "s/Shruti's Life RPG/Shruti Life RPG/" app/src/main/res/values/strings.xml

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shruti-life-rpg-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
